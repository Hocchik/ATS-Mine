[project]
name = "criterio-ai"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/criterio_ai"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
